[project]
name = "vigil-aiops"
version = "0.1.0"
description = "面向 Kubernetes 的可审计故障调查与受控修复"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "deepagents==0.7.37",
    "httpx>=0.28,<1",
    "kubernetes>=33,<36",
    "langchain>=1.5",
    "langchain-core>=1.8",
    "langchain-openai>=1.0,<2",
    "langfuse>=3,<4",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.2,<4",
    "loguru>=0.7,<1",
    "psycopg[binary,pool]>=3.3,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pyyaml>=6,<7",
    "starlette>=0.41,<1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
vigil = "aiops.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 包目录同时包含迁移和网页任务交付的 static/ 资源。
packages = ["src/aiops"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "aiops/_builtin_skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
