apiVersion: v1
kind: ConfigMap
metadata:
  name: vigil-grafana-provisioning
  namespace: vigil-monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Vigil Prometheus
        uid: vigil-prometheus
        type: prometheus
        access: proxy
        url: http://127.0.0.1:8081/prometheus
        isDefault: true
        editable: false
        jsonData:
          httpMethod: GET
          prometheusType: Prometheus
          timeInterval: 15s
      - name: Vigil AlertManager
        uid: vigil-alertmanager
        type: alertmanager
        access: proxy
        url: http://127.0.0.1:8081/alertmanager
        editable: false
        jsonData:
          implementation: prometheus
          handleGrafanaManagedAlerts: false
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: Vigil
        folder: Vigil
        type: file
        disableDeletion: true
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards
  query-proxy.conf: |
    server {
      listen 127.0.0.1:8081;
      location ~ ^/prometheus/api/v1/(query(_range)?|series|labels|label/[a-zA-Z0-9_]+/values|metadata|status/buildinfo)$ {
        limit_except GET { deny all; }
        rewrite ^/prometheus(/.*)$ $1 break;
        proxy_pass http://prometheus:9090;
      }
      location ~ ^/alertmanager/api/v2/(alerts(/groups)?|silences(/[0-9a-f-]+)?)$ {
        limit_except GET { deny all; }
        rewrite ^/alertmanager(/.*)$ $1 break;
        proxy_pass http://alertmanager:9093;
      }
      location / { return 404; }
    }
---
apiVersion: v1
kind: ConfigMap
