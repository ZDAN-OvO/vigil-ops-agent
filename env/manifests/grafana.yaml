          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "缺数"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "变更时间"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "dateTimeAsIso"
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "vigil-prometheus"
              },
              "refId": "A",
              "expr": "1000 * ((vigil_release_timestamp_seconds > time() - 86400) and on (job, instance) (up{job=\"vigil-releases\"} == 1))",
              "legendFormat": "",
              "format": "table",
              "instant": true,
              "range": false
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "change_at": true,
                  "instance": true,
                  "job": true
                },
                "indexByName": {
                  "Value": 0,
                  "namespace": 1,
                  "service": 2,
                  "version": 3,
                  "change_type": 4
                },
                "renameByName": {
                  "Value": "变更时间",
                  "namespace": "命名空间",
                  "service": "服务",
                  "version": "版本",
                  "change_type": "类型"
                }
              }
            }
          ],
          "options": {
            "sortBy": [
              {
                "displayName": "变更时间",
                "desc": true
              }
            ]
