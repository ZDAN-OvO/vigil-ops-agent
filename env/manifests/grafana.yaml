  vigil-releases.json: |
    {
      "uid": "vigil-releases",
      "title": "发布",
      "tags": [
        "Vigil"
      ],
      "schemaVersion": 39,
      "editable": false,
      "timezone": "browser",
      "refresh": "30s",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
