apiVersion: apps/v1
kind: Deployment
metadata:
  name: vigil-grafana
  namespace: vigil-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vigil-grafana
  template:
    metadata:
      labels:
        app: vigil-grafana
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana@sha256:2175aaa91c96733d86d31cf270d5310b278654b03f5718c59de12a865380a31f
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_AUTH_BASIC_ENABLED
              value: "false"
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/vigil.yaml
              subPath: datasources.yaml
              readOnly: true
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/vigil.yaml
              subPath: dashboards.yaml
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
        - name: query-proxy
          image: nginx@sha256:4870c12cd2ca986de501a804b4f506ad3875a0b1874940ba0a2c7f763f1855b2
          volumeMounts:
            - name: provisioning
              mountPath: /etc/nginx/conf.d
              readOnly: true
              subPath: nginx
      volumes:
        - name: provisioning
          configMap:
            name: vigil-grafana-provisioning
            items:
              - key: datasources.yaml
                path: datasources.yaml
              - key: dashboards.yaml
                path: dashboards.yaml
              - key: query-proxy.conf
                path: nginx/vigil.conf
        - name: dashboards
          configMap:
            name: vigil-grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: vigil-grafana
  namespace: vigil-monitoring
spec:
  selector:
