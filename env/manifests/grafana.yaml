  name: vigil-grafana-dashboards
  namespace: vigil-monitoring
data:
  vigil-alerts.json: |
    {
      "uid": "vigil-alerts",
      "title": "告警",
      "tags": [
        "Vigil"
      ],
      "schemaVersion": 39,
      "editable": false,
      "timezone": "browser",
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "正在触发的规则告警",
          "description": "",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "vigil-prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "缺数",
              "custom": {
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "vigil-prometheus"
              },
              "refId": "A",
              "expr": "sum by (alertname, severity) (ALERTS{alertstate=\"firing\"})",
              "legendFormat": "{{alertname}} · {{severity}}",
              "format": "time_series",
              "instant": false,
              "range": true
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "AlertManager 告警状态",
          "description": "",
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 24,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "vigil-prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "缺数",
              "custom": {
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "vigil-prometheus"
              },
              "refId": "A",
              "expr": "sum by (state) (alertmanager_alerts{job=\"alertmanager\"})",
              "legendFormat": "{{state}}",
              "format": "time_series",
              "instant": false,
              "range": true
