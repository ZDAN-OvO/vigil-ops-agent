apiVersion: v1
kind: Namespace
metadata:
  name: vigil-monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vigil-prometheus
  namespace: vigil-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vigil-prometheus-cadvisor
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["nodes/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vigil-prometheus-cadvisor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vigil-prometheus-cadvisor
subjects:
  - kind: ServiceAccount
    name: vigil-prometheus
    namespace: vigil-monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: vigil-monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/rules.yml
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager:9093
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics:8080"]
      - job_name: alertmanager
        static_configs:
          - targets: ["alertmanager:9093"]
      - job_name: blackbox-exporter
        static_configs:
          - targets: ["blackbox-exporter:9115"]
      - job_name: frontend-probe
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets: ["http://frontend.vigil-shop.svc.cluster.local./"]
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter:9115
      - job_name: vigil-entry-probe
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - labels:
              application: online-boutique
            targets:
              - "http://frontend.vigil-shop.svc.cluster.local./"
              - "http://frontend.vigil-shop.svc.cluster.local./product/OLJCESPC7Z"
              - "http://frontend.vigil-shop.svc.cluster.local./cart"
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: address
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter:9115
      - job_name: vigil-replica-probe
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets: ["http://vigil-replica-gateway.vigil-experiment.svc.cluster.local.:8080/business"]
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter:9115
      - job_name: vigil-replica-state
        static_configs:
          - targets: ["vigil-replica-gateway.vigil-experiment.svc.cluster.local.:8080"]
      - job_name: vigil-config-probe
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets: ["http://vigil-config-fixture.vigil-experiment.svc.cluster.local.:8080/configuration?source=configmap"]
            labels: {signal: gate, source: configmap}
          - targets: ["http://vigil-config-fixture.vigil-experiment.svc.cluster.local.:8080/configuration?source=env"]
            labels: {signal: gate, source: env}
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter:9115
      - job_name: vigil-config-business
        scrape_interval: 1m
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets: ["http://vigil-config-fixture.vigil-experiment.svc.cluster.local.:8080/business?source=configmap"]
            labels: {signal: business, source: configmap}
          - targets: ["http://vigil-config-fixture.vigil-experiment.svc.cluster.local.:8080/business?source=env"]
            labels: {signal: business, source: env}
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter:9115
          - target_label: job
            replacement: vigil-config-probe
      - job_name: vigil-config-state
        static_configs:
          - targets: ["vigil-config-fixture.vigil-experiment.svc.cluster.local.:8080"]
      - job_name: kubelet-cadvisor
        scheme: https
        metrics_path: /metrics/cadvisor
        kubernetes_sd_configs:
          - role: node
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: "container_cpu_usage_seconds_total|container_memory_working_set_bytes|container_cpu_cfs_throttled_periods_total|container_cpu_cfs_periods_total"
            action: keep
          - source_labels: [namespace, pod, container]
            regex: ".+;.+;.+"
            action: keep
          - source_labels: [container]
            regex: "POD"
            action: drop
      - job_name: vigil-releases
        scrape_interval: 1m
        static_configs:
          - targets: ["host.k3d.internal:8092"]
  rules.yml: |
    groups:
      - name: vigil-business
        rules:
          - record: vigil:currency_cpu_throttle_ratio:rate1m
            expr: |
              sum(rate(container_cpu_cfs_throttled_periods_total{job="kubelet-cadvisor",namespace="vigil-shop",pod=~"currencyservice-.*",container="server"}[1m]))
              /
              (sum(rate(container_cpu_cfs_periods_total{job="kubelet-cadvisor",namespace="vigil-shop",pod=~"currencyservice-.*",container="server"}[1m])) > 0)
          - alert: FrontendProbeFailed
            expr: probe_success{job="frontend-probe",instance="http://frontend.vigil-shop.svc.cluster.local./"} == 0
            for: 1m
            labels:
              severity: critical
              namespace: vigil-shop
              target: currencyservice
              source: frontend
            annotations:
              summary: Frontend blackbox probe failed
              description: probe_success has been 0 for 1 minute.
          - alert: VigilCpuLimitDegraded
            expr: |
              (probe_success{job="frontend-probe"} == 0)
              and on() (vigil:currency_cpu_throttle_ratio:rate1m >= 0.5)
            for: 1m
            labels:
              severity: critical
              namespace: vigil-shop
              target: currencyservice
              source: cpu
            annotations:
              summary: Currency service is CPU throttled and storefront requests fail
          - alert: VigilReplicaCapacityDegraded
            expr: |
              (probe_success{job="vigil-replica-probe"} == 0)
              and on() (up{job="vigil-replica-state"} == 1)
            for: 1m
            labels:
              severity: critical
              namespace: vigil-experiment
              target: vigil-replica-fixture
              source: capacity
            annotations:
              summary: Two concurrent transactions exceed available capacity
          - alert: VigilServiceConfigDegraded
            expr: |
              (probe_success{job="vigil-config-probe",signal="gate"} == 0)
              and on() (up{job="vigil-config-state"} == 1)
            for: 1m
            labels:
              severity: critical
              namespace: vigil-experiment
              target: vigil-config-fixture
            annotations:
              summary: Service requests fail with the loaded configuration
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: vigil-monitoring
data:
  alertmanager.yml: |
    route:
      receiver: default
      group_by: [alertname, namespace, target, source]
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 1h
      routes:
        - matchers:
            - alertname="FrontendProbeFailed"
          receiver: vigil-webhook
        - matchers:
            - alertname="VigilCpuLimitDegraded"
          receiver: vigil-webhook
        - matchers:
            - alertname="VigilReplicaCapacityDegraded"
          receiver: vigil-webhook
        - matchers:
            - alertname="VigilServiceConfigDegraded"
          receiver: vigil-webhook
    receivers:
      - name: default
      - name: vigil-webhook
        webhook_configs:
          - url: http://172.20.0.1:8091/webhook/alertmanager
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/token
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-config
  namespace: vigil-monitoring
data:
  blackbox.yml: |
    modules:
      http_2xx:
        prober: http
        timeout: 5s
        http:
          preferred_ip_protocol: ip4
          valid_status_codes: [200]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: vigil-monitoring
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: vigil-monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: vigil-prometheus
      securityContext:
        fsGroup: 65534
      containers:
        - name: prometheus
          image: quay.io/prometheus/prometheus@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: vigil-monitoring
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: vigil-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      securityContext:
        fsGroup: 65534
      containers:
        - name: alertmanager
          image: quay.io/prometheus/alertmanager@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - name: http
              containerPort: 9093
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: data
              mountPath: /alertmanager
            - name: webhook-token
              mountPath: /etc/alertmanager/secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: data
          emptyDir: {}
        - name: webhook-token
          secret:
            secretName: vigil-webhook-token
            items:
              - key: token
                path: token
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: vigil-monitoring
spec:
  selector:
    app: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  namespace: vigil-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blackbox-exporter
  template:
    metadata:
      labels:
        app: blackbox-exporter
    spec:
      containers:
        - name: blackbox-exporter
          image: quay.io/prometheus/blackbox-exporter@sha256:ea1c7aa3ef3f307cd03e85f34abb604478ccb90b567fc690da0cd9776da76b13
          args:
            - --config.file=/etc/blackbox_exporter/blackbox.yml
          ports:
            - name: http
              containerPort: 9115
          volumeMounts:
            - name: config
              mountPath: /etc/blackbox_exporter
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: blackbox-config
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  namespace: vigil-monitoring
spec:
  selector:
    app: blackbox-exporter
  ports:
    - name: http
      port: 9115
      targetPort: http
