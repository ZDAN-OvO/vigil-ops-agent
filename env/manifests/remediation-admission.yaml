apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vigil-remediation-config-consumers
  annotations:
    vigil.aiops/policy-version: controlled-remediation-v1-8f5dcece25ec1c30e97b837ec5bec5b7726f785c4e50a3838b733fbe676a832e
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
      - pods/ephemeralcontainers
      - podtemplates
      - replicationcontrollers
      scope: Namespaced
    - apiGroups:
      - apps
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - deployments
      - statefulsets
      - replicasets
      - daemonsets
      scope: Namespaced
    - apiGroups:
      - batch
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - cronjobs
      - jobs
      scope: Namespaced
  variables:
  - name: reservations
    expression: |-
      [{"configMap":"vigil-config-fixture","namespace":"vigil-experiment","resource":"deployments","workload":"vigil-config-fixture"}]
  - name: resource
    expression: |-
      request.resource.resource
  - name: spec
    expression: |-
      dyn(object).?spec.orValue({})
  - name: podSpec
    expression: |-
      variables.resource == 'pods' ? variables.spec : variables.resource == 'podtemplates' ? dyn(object).template.spec : variables.resource == 'cronjobs' ? variables.spec.jobTemplate.spec.template.spec : variables.spec.?template.orValue({}).?spec.orValue({})
  - name: owners
    expression: |-
      dyn(object).metadata.?ownerReferences.orValue([])
  - name: containers
    expression: |-
      variables.podSpec.?containers.orValue([]) + variables.podSpec.?initContainers.orValue([]) + variables.podSpec.?ephemeralContainers.orValue([])
  - name: volumes
    expression: |-
      variables.podSpec.?volumes.orValue([])
  - name: username
    expression: |-
      request.userInfo.username
  validations:
  - expression: |-
      variables.reservations.all(r, request.namespace != r.namespace || !(
      variables.volumes.exists(v,
        v.?configMap.orValue({}).?name.orValue('') == r.configMap ||
        v.?projected.orValue({}).?sources.orValue([]).exists(s,
          s.?configMap.orValue({}).?name.orValue('') == r.configMap
        )
      ) ||
      variables.containers.exists(c,
        c.?envFrom.orValue([]).exists(e, e.?configMapRef.orValue({}).?name.orValue('') == r.configMap) ||
        c.?env.orValue([]).exists(e,
          e.?valueFrom.orValue({}).?configMapKeyRef.orValue({}).?name.orValue('') == r.configMap
        )
      )
      ) || (
      (variables.resource == r.resource && request.name == r.workload) ||
      (variables.resource == 'replicasets' && r.resource == 'deployments' &&
       variables.username in [
         'system:kube-controller-manager', 'system:serviceaccount:kube-system:deployment-controller'
       ] &&
       variables.owners.exists(o,
         o.?controller.orValue(false) && o.apiVersion == 'apps/v1' && o.kind == 'Deployment' &&
         o.name == r.workload && o.uid != ''
       )) ||
      (variables.resource == 'pods' &&
       variables.owners.exists(o,
         o.?controller.orValue(false) && o.apiVersion == 'apps/v1' && o.uid != '' && (
           (r.resource == 'deployments' && o.kind == 'ReplicaSet' &&
            o.name.startsWith(r.workload + '-') && variables.username in [
              'system:kube-controller-manager', 'system:serviceaccount:kube-system:replicaset-controller'
            ]) ||
           (r.resource == 'statefulsets' && o.kind == 'StatefulSet' && o.name == r.workload &&
            variables.username in [
              'system:kube-controller-manager', 'system:serviceaccount:kube-system:statefulset-controller'
            ])
         )
       ))
      ))
    message: ConfigMap reserved for one remediation workload
