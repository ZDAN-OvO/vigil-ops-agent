apiVersion: v1
kind: ConfigMap
metadata:
  name: vigil-config-fixture
  namespace: vigil-experiment
data:
  mode: healthy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vigil-config-fixture
  namespace: vigil-experiment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vigil-config-fixture
  template:
    metadata:
      labels:
        app: vigil-config-fixture
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: python:3.12-alpine
          command: [python, -u, /fixture/app.py]
          env:
            - name: VIGIL_MODE
              value: healthy
            - name: VIGIL_PROFILE
              value: normal
          readinessProbe:
            httpGet:
              path: /live
              port: 8080
            periodSeconds: 2
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: app
              mountPath: /fixture
              readOnly: true
            - name: service-config
              mountPath: /service-config
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: vigil-config-code
        - name: service-config
          configMap:
            name: vigil-config-fixture
---
apiVersion: v1
kind: Service
metadata:
  name: vigil-config-fixture
  namespace: vigil-experiment
spec:
  selector:
    app: vigil-config-fixture
  ports:
    - port: 8080
