apiVersion: v1
kind: Service
metadata:
  name: rebuild-demo
  namespace: vigil-shop
  labels:
    app: rebuild-demo
spec:
  selector:
    app: rebuild-demo
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rebuild-demo
  namespace: vigil-shop
  labels:
    app: rebuild-demo
    vigil.io/discardable: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rebuild-demo
  template:
    metadata:
      labels:
        app: rebuild-demo
        vigil.io/discardable: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: vigil/pod-rebuild-demo:20261105
          imagePullPolicy: IfNotPresent
          env:
            - name: STATE_FILE
              value: /state/work_state
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: state
              mountPath: /state
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 20m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: state
          emptyDir: {}
