apiVersion: v1
kind: Service
metadata:
  name: redis-cart-direct
  namespace: vigil-shop
spec:
  selector:
    app: redis-cart
  ports:
    - name: tcp-redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-access-proxy
  namespace: vigil-shop
  labels:
    app: redis-access-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-access-proxy
  template:
    metadata:
      labels:
        app: redis-access-proxy
    spec:
      containers:
        - name: proxy
          image: vigil/redis-access-proxy:20261105
          imagePullPolicy: IfNotPresent
          env:
            - name: DELAY_MS
              value: "500"
            - name: UPSTREAM_HOST
              value: redis-cart-direct
            - name: UPSTREAM_PORT
              value: "6379"
          ports:
            - containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 5
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 20m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
