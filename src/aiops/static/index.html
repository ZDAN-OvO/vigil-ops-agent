<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Vigil</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Vigil</a>
    <span id="connection" class="stamp" role="status"></span>
  </header>
  <main class="workspace">
    <aside class="sessions" aria-labelledby="sessions-title">
      <header class="sessions-head">
        <h2 id="sessions-title" class="stamp">会话</h2>
        <button class="session-control" id="new-session" type="button" disabled>新会话</button>
      </header>
      <p id="sessions-access" class="notice"></p>
      <p id="sessions-notice" class="notice" role="status"></p>
      <nav id="session-list" aria-label="会话列表"></nav>
    </aside>
    <section class="conversation" aria-labelledby="session-title">
      <header class="conversation-head">
        <div class="session-heading">
          <p id="session-meta" class="stamp"></p>
          <h1 id="session-title">选择会话</h1>
        </div>
        <div id="session-actions"></div>
      </header>
      <div id="ledger" class="ledger" aria-label="会话事件账本" role="region" tabindex="0" hidden>
        <button class="ledger-prev" type="button" aria-label="查看更早的事件" hidden>←</button>
        <div class="ledger-window"></div>
        <pre class="event-popover" aria-label="会话事件详情" tabindex="0" hidden></pre>
      </div>
      <div id="conversation-scroll" class="conversation-scroll">
        <p id="session-notice" class="notice" role="status"></p>
        <div id="event-stream" class="event-stream" aria-label="会话内容"></div>
      </div>
      <form id="composer" class="composer">
        <p id="compose-notice" class="notice" role="status"></p>
        <div class="compose-row">
          <label class="visually-hidden" for="question">输入调查问题</label>
          <textarea id="question" rows="2" placeholder="输入调查问题…" disabled></textarea>
          <button id="send" type="submit" disabled>发送</button>
        </div>
      </form>
    </section>
    <aside class="monitoring" aria-labelledby="monitoring-title">
      <header class="monitoring-head">
        <h2 id="monitoring-title" class="stamp">值班面板</h2>
        <button id="monitor-toggle" class="disclosure" type="button"
                aria-controls="monitoring-content" aria-expanded="true">[−]</button>
      </header>
      <div id="monitoring-content" class="monitoring-content">
        <div id="monitoring-hero" class="hero"></div>
        <div id="monitoring-blocks"></div>
      </div>
    </aside>
  </main>
</body>
</html>
